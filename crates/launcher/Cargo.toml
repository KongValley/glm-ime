[package]
name = "glm-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_Security_Authorization",
]

[profile.release]
opt-level = 3
lto = true
